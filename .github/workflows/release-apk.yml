# Builds the Android app, signs it with the project's release key, and attaches it to a GitHub Release.
#
# Start it by publishing a release on GitHub whose tag starts with android-v (Releases > Draft a new release >
# tag android-v1.2 > Publish), or by running it by hand (Actions > Release Android APK > Run workflow), which
# builds and signs the APK and keeps it as a downloadable workflow artifact without making a release.
# Only people with write access to this repository can do either. After a release, it republishes the Pages
# site so https://ml-chen.github.io/couchcatch/couchcatch.apk is the new version.
#
# Secrets (Settings > Secrets and variables > Actions, or on the android-signing environment):
#   ANDROID_KEYSTORE_B64       the release keystore, base64-encoded (one line)
#   ANDROID_KEYSTORE_PASSWORD  its password (the key inside uses the same one); the key alias is couchcatch
# GitHub never gives secrets to workflows started from forks or pull requests. The job refuses to publish an
# APK whose signing certificate is not the project's (fingerprint pinned below), so a wrong key can't slip in.
name: Release Android APK
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: release-apk
  cancel-in-progress: false
env:
  CERT_SHA256: CF:9A:2F:61:18:46:33:CD:74:C1:AA:23:69:B5:02:FF:D4:1F:6C:43:02:53:E8:A8:A7:FE:A2:76:E1:37:60:E6
jobs:
  release:
    if: github.repository == 'ML-Chen/couchcatch' && (github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'android-v'))
    runs-on: ubuntu-latest
    environment: android-signing
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
          fetch-depth: 0
      - name: Install the Android build tools
        run: |
          SDKM="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin | sort -V | tail -1)/sdkmanager"
          yes | "$SDKM" --install "build-tools;35.0.1" "platforms;android-35" > /dev/null
          echo "ANDROID_BUILD_TOOLS=$ANDROID_HOME/build-tools/35.0.1" >> "$GITHUB_ENV"
          echo "ANDROID_PLATFORM=$ANDROID_HOME/platforms/android-35" >> "$GITHUB_ENV"
      - name: Build the single-file game
        run: cd src && python3 build.py draw.js ../dist/couchcatch.html
      - name: Build and sign the APK
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_B64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "::error::Add the ANDROID_KEYSTORE_B64 and ANDROID_KEYSTORE_PASSWORD secrets first."; exit 1
          fi
          KS="$RUNNER_TEMP/release.keystore"
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 -d > "$KS"
          ANDROID_KEYSTORE="$KS" ANDROID_KEY_ALIAS=couchcatch android/build.sh dist/couchcatch.html dist/couchcatch.apk
          rm -f "$KS"
      - name: Check the APK is signed with the project's key
        run: |
          got="$("$ANDROID_BUILD_TOOLS/apksigner" verify --print-certs dist/couchcatch.apk | sed -n 's/.*certificate SHA-256 digest: //p' | head -1 | tr 'a-f' 'A-F' | sed 's/../&:/g; s/:$//')"
          [ "$got" = "$CERT_SHA256" ] || { echo "::error::APK signed with $got, expected $CERT_SHA256"; exit 1; }
          sha256sum dist/couchcatch.apk
      - name: Keep the APK as a workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: couchcatch-apk
          path: dist/couchcatch.apk
      - name: Attach the APK to the release and republish the Pages site
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$TAG" dist/couchcatch.apk --repo "$GITHUB_REPOSITORY" --clobber
          if [ -z "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body)" ]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file android/release/NOTES.md
          fi
          gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" --ref main
