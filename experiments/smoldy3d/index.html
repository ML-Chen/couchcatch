// extension there is no way to ask "are you done?", so we just take the result (which waits).
function waitForProgram() {
  if (contextLost) return;
  if (parallelCompile && !gl.getProgramParameter(program, parallelCompile.COMPLETION_STATUS_KHR)) {
    requestAnimationFrame(waitForProgram);
    return;
  }
  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    const log = gl.getShaderInfoLog(fragmentShader) || gl.getProgramInfoLog(program);
    showFallback('The 3D view could not start on this device.');
    throw new Error(log);
  }
  finishSetup();
}

// The program is ready: use it, make the full-screen triangle, look up every uniform.
function finishSetup() {
  gl.useProgram(program);
  // One triangle big enough to cover the screen (cheaper than two triangles making a quad).
  const buffer = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const positionLocation = gl.getAttribLocation(program, 'aPosition');
  gl.enableVertexAttribArray(positionLocation);
  gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);
  for (const name of ['uResolution', 'uTime', 'uCameraPosition', 'uCameraTarget', 'uBreath', 'uHeadPivot',
    'uHeadRotation', 'uEarRightFrame', 'uEarLeftFrame', 'uBlink', 'uTailStart', 'uTailBend', 'uTailEnd',
    'uFlameBase', 'uFlameLean', 'uFlameGlow', 'uMarchSteps', 'uShadowSteps', 'uOcclusionSamples', 'uFlameSteps']) {
    uniforms[name] = gl.getUniformLocation(program, name);
  }
  programReady = true;
  if (stillMode) {
    window.renderStill = renderStill;
    document.body.dataset.ready = '1';
  } else {
    calibrate();
    updateRunning();
  }
}

// ==============================================================================================
// D. Camera: orbits around the fox. Drag to turn, pinch or scroll to zoom. The "target" values
//    follow the finger; the "current" values glide towards them each frame for smooth damping.
// ==============================================================================================
const DEFAULT_TARGET = [0, 0.52, 0.0];
const FACE_TARGET = [0, 0.66, 0.30];
const BASE_DISTANCE = 2.2;
const camera = {
  yaw: 0.75, pitch: 0.20, zoom: 1.0,            // current (smoothed) values
  targetYaw: 0.75, targetPitch: 0.20, targetZoom: 1.0,
  lookAt: DEFAULT_TARGET.slice(),
};
let userHasTouched = false;
const activePointers = new Map();
let pinchStartDistance = 0;
let pinchStartZoom = 1;

function pinchDistance() {
  const [first, second] = [...activePointers.values()];
  return Math.hypot(first.x - second.x, first.y - second.y);
}

canvas.addEventListener('pointerdown', (event) => {
  canvas.setPointerCapture(event.pointerId);
  activePointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
  userHasTouched = true;
  if (activePointers.size === 2) { pinchStartDistance = pinchDistance(); pinchStartZoom = camera.targetZoom; }
});
canvas.addEventListener('pointermove', (event) => {
  const previous = activePointers.get(event.pointerId);
  if (!previous) return;
  const current = { x: event.clientX, y: event.clientY };
  activePointers.set(event.pointerId, current);
  if (activePointers.size === 1) {
    // One finger: turn. Moving across the whole screen turns about one full circle.
    const scale = 6.0 / Math.max(window.innerWidth, 1);
    camera.targetYaw -= (current.x - previous.x) * scale;
    camera.targetPitch = clamp(camera.targetPitch + (current.y - previous.y) * scale * 0.6, 0.0, 1.25);
  } else if (activePointers.size === 2 && pinchStartDistance > 0) {
    // Two fingers: pinch to zoom.
    camera.targetZoom = clampZoom(pinchStartZoom * pinchStartDistance / Math.max(pinchDistance(), 1));
  }
});
function releasePointer(event) {
  activePointers.delete(event.pointerId);
  pinchStartDistance = 0;
}
canvas.addEventListener('pointerup', releasePointer);
canvas.addEventListener('pointercancel', releasePointer);
canvas.addEventListener('wheel', (event) => {
  event.preventDefault();
  userHasTouched = true;
  camera.targetZoom = clampZoom(camera.targetZoom * Math.exp(event.deltaY * 0.0012));
}, { passive: false });

function clampZoom(zoom) { return clamp(zoom, 0.6, 1.5); }

// Move the current camera values a fraction of the way to their targets: exponential smoothing that
// behaves the same at any frame rate.
function updateCamera(deltaSeconds) {
  if (!userHasTouched) camera.targetYaw += deltaSeconds * 0.16;   // slow showcase spin until touched
  const follow = 1 - Math.exp(-deltaSeconds * 7);
  camera.yaw += (camera.targetYaw - camera.yaw) * follow;
  camera.pitch += (camera.targetPitch - camera.pitch) * follow;
  camera.zoom += (camera.targetZoom - camera.zoom) * follow;
}

function cameraPosition() {
  // On a portrait phone the picture is framed by its narrow width, so come in a little closer.
  const portrait = canvas.clientHeight > canvas.clientWidth;
  const distance = BASE_DISTANCE * camera.zoom * (portrait ? 0.9 : 1.0);
  return [
    camera.lookAt[0] + distance * Math.sin(camera.yaw) * Math.cos(camera.pitch),
    camera.lookAt[1] + distance * Math.sin(camera.pitch),
    camera.lookAt[2] + distance * Math.cos(camera.yaw) * Math.cos(camera.pitch),
  ];
}

// ==============================================================================================
// E. Staying fast. The rule: no single frame should keep the GPU busy for more than about 30 ms,
//    because inside a page (or an iframe) a long GPU frame stalls everything on screen.
//    - We draw at most 30 frames a second.
//    - We draw fewer pixels than the screen has (the browser scales the canvas up), never more than
//      PIXEL_CAP, starting at 40% of the screen's resolution.
//    - Every so often a "probe" frame is timed with gl.finish() (which waits for the GPU), giving the
//      true cost per pixel; the resolution is then set to fit GPU_BUDGET_MS, rising only gently.
//    - A frame that arrives late shrinks the resolution at once.
//    - At the lowest resolution, if it is still too slow, the shader takes fewer steps.
// ==============================================================================================
const FRAME_INTERVAL_MS = 1000 / 30;
const GPU_BUDGET_MS = 16;
const PIXEL_CAP = 350000;
const START_SCALE = 0.4;
const MIN_RENDER_SCALE = 0.2;
const MAX_RENDER_SCALE = Math.min(window.devicePixelRatio || 1, 1.5);
const PROBE_EVERY_FRAMES = 40;           // about every 1.3 seconds at 30 frames a second...
const PROBE_SOON_FRAMES = 8;             // ...or sooner while the resolution is still climbing
const LATE_FRAME_MS = 55;                // a frame this late means the GPU is falling behind
let renderScale = stillMode ? parseFloat(params.get('scale') || '1') : START_SCALE;
let msPerMegapixel = null;               // learned from probe frames
let lowQuality = false;

// Loop budgets for the shader (see "Loop budgets" at the top of the fragment shader).
function loopBudgets() {
  return lowQuality ? { march: 40, shadow: 12, occlusion: 2, flame: 8 } : { march: 64, shadow: 20, occlusion: 4, flame: 14 };
}

function cssPixelCount() {
  return Math.max(1, canvas.clientWidth) * Math.max(1, canvas.clientHeight);
}

function resizeCanvas() {
  let width = Math.round(Math.max(1, canvas.clientWidth) * renderScale);
  let height = Math.round(Math.max(1, canvas.clientHeight) * renderScale);
  if (!stillMode && width * height > PIXEL_CAP) {
    const shrink = Math.sqrt(PIXEL_CAP / (width * height));
    width = Math.floor(width * shrink);
    height = Math.floor(height * shrink);
  }
  width = Math.max(1, width);
  height = Math.max(1, height);
  if (canvas.width !== width || canvas.height !== height) {
    canvas.width = width;
    canvas.height = height;
  }
}

// Draw one frame and wait for the GPU to finish it, to measure its real cost. Waiting blocks the
// page for the length of that frame, which is why it is done only now and then, on frames that are
// already sized to fit the budget.
function timedFrame(time) {
  const start = performance.now();
  drawFrame(time);
  gl.finish();
  gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array(4));   // make sure it has really finished
  return performance.now() - start;
}

// Learn the cost per pixel from a probe frame and pick the resolution for the next frames.
function learnFromProbe(frameMs) {
  const pixels = canvas.width * canvas.height;
  const sample = frameMs / (pixels / 1e6);
  msPerMegapixel = msPerMegapixel === null ? sample : 0.5 * msPerMegapixel + 0.5 * sample;
  const affordablePixels = GPU_BUDGET_MS / msPerMegapixel * 1e6;
  let targetPixels = Math.min(affordablePixels, PIXEL_CAP, cssPixelCount() * MAX_RENDER_SCALE * MAX_RENDER_SCALE);
  // Grow gently: by at most 15% per probe when close to the budget, by up to 50% when far below it.
  const growing = targetPixels > pixels * 1.01;
  if (growing) targetPixels = Math.min(targetPixels, pixels * (frameMs * 3 < GPU_BUDGET_MS ? 1.5 : 1.15));
  framesUntilProbe = growing ? PROBE_SOON_FRAMES : PROBE_EVERY_FRAMES;
  renderScale = clamp(Math.sqrt(targetPixels / cssPixelCount()), MIN_RENDER_SCALE, MAX_RENDER_SCALE);
  // Already at the lowest resolution and still over budget: take fewer steps. Plenty of room: go back.
  if (renderScale <= MIN_RENDER_SCALE + 1e-3 && frameMs > GPU_BUDGET_MS) lowQuality = true;
  else if (frameMs < GPU_BUDGET_MS * 0.5) lowQuality = false;
}

// Before the first real frame: a tiny warm-up frame (some drivers finish preparing a shader on its
// first use), then a small timed frame to estimate this device's speed. Start at whichever is
// smaller: 40% of the screen's resolution, or what that estimate says fits the budget.
function calibrate() {
  renderScale = Math.sqrt(1 / cssPixelCount());                 // 1 pixel
  timedFrame(0);
  renderScale = Math.sqrt(12000 / cssPixelCount());             // about 12,000 pixels
  learnFromProbe(timedFrame(0));
  renderScale = clamp(Math.min(renderScale, START_SCALE), MIN_RENDER_SCALE, MAX_RENDER_SCALE);
}

// ==============================================================================================
// F. Drawing a frame: upload the pose, camera and loop budgets, draw the triangle.
// ==============================================================================================
function drawFrame(time) {
  resizeCanvas();
  gl.viewport(0, 0, canvas.width, canvas.height);
  const pose = poseFox(time);
  const budgets = loopBudgets();
  gl.uniform2f(uniforms.uResolution, canvas.width, canvas.height);
  gl.uniform1f(uniforms.uTime, time % 1000);
  gl.uniform3fv(uniforms.uCameraPosition, cameraPosition());
  gl.uniform3fv(uniforms.uCameraTarget, camera.lookAt);
  gl.uniform1f(uniforms.uBreath, pose.breath);
  gl.uniform3fv(uniforms.uHeadPivot, pose.headPivot);
  gl.uniformMatrix3fv(uniforms.uHeadRotation, false, toGlslMatrix(pose.headRotation));
  gl.uniformMatrix3fv(uniforms.uEarRightFrame, false, toGlslMatrix(pose.earRight));
  gl.uniformMatrix3fv(uniforms.uEarLeftFrame, false, toGlslMatrix(pose.earLeft));
  gl.uniform1f(uniforms.uBlink, pose.blink);
  gl.uniform3fv(uniforms.uTailStart, pose.tailStart);
  gl.uniform3fv(uniforms.uTailBend, pose.tailBend);
  gl.uniform3fv(uniforms.uTailEnd, pose.tailEnd);
  gl.uniform3fv(uniforms.uFlameBase, pose.flameBase);
  gl.uniform2fv(uniforms.uFlameLean, pose.flameLean);
  gl.uniform1f(uniforms.uFlameGlow, pose.flameGlow);
  gl.uniform1i(uniforms.uMarchSteps, budgets.march);
  gl.uniform1i(uniforms.uShadowSteps, budgets.shadow);
  gl.uniform1i(uniforms.uOcclusionSamples, budgets.occlusion);
  gl.uniform1i(uniforms.uFlameSteps, budgets.flame);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

// ==============================================================================================
// G. The animation loop, which only runs while there is something to see: the shader is ready,
//    the page is visible (not a background tab) and the canvas is on screen (an iframe scrolled out
//    of view counts as off screen).
// ==============================================================================================
const startMs = performance.now();
let running = false;
let pageVisible = document.visibilityState !== 'hidden';
let onScreen = true;
let lastFrameMs = null;
let framesUntilProbe = PROBE_SOON_FRAMES;   // counts down to the next timed probe frame

function updateRunning() {
  const shouldRun = programReady && pageVisible && onScreen && !contextLost && !stillMode;
  if (shouldRun && !running) {
    running = true;
    lastFrameMs = null;               // don't count the pause as a slow frame
    requestAnimationFrame(animationLoop);
  } else if (!shouldRun) {
    running = false;
  }
}

function animationLoop(nowMs) {
  if (!running) return;
  requestAnimationFrame(animationLoop);
  // At most 30 frames a second: skip animation frames that come sooner than that.
  if (lastFrameMs !== null && nowMs - lastFrameMs < FRAME_INTERVAL_MS - 3) return;
  const intervalMs = lastFrameMs === null ? FRAME_INTERVAL_MS : nowMs - lastFrameMs;
  lastFrameMs = nowMs;
  updateCamera(Math.min(intervalMs, 100) / 1000);
  const time = (nowMs - startMs) / 1000;

  // A late frame means the GPU is falling behind: shrink straight away, and re-measure next frame.
  if (intervalMs > LATE_FRAME_MS) {
    renderScale = Math.max(MIN_RENDER_SCALE, renderScale * 0.75);
    framesUntilProbe = 0;
  }
  if (framesUntilProbe <= 0) {
    learnFromProbe(timedFrame(time));             // also schedules the next probe
  } else {
    framesUntilProbe--;
    drawFrame(time);
  }
  // The first frame is on screen: fade the 3D view in over the poster.
  if (!document.body.classList.contains('ready')) document.body.classList.add('ready');
}

// Pause in a background tab, or when the canvas is scrolled out of view.
document.addEventListener('visibilitychange', () => {
  pageVisible = document.visibilityState !== 'hidden';
  updateRunning();
});
if ('IntersectionObserver' in window) {
  new IntersectionObserver((entries) => {
    onScreen = entries[entries.length - 1].isIntersecting;
    updateRunning();
  }).observe(canvas);
}

// Still mode (screenshots and measurements): window.renderStill({yaw, pitch, zoom, time, focus})
// draws one frame at the resolution given by ?scale= and waits for it to finish.
function renderStill(options) {
  camera.yaw = camera.targetYaw = options.yaw ?? 0.75;
  camera.pitch = camera.targetPitch = options.pitch ?? 0.2;
  camera.zoom = camera.targetZoom = options.zoom ?? 1.0;
  camera.lookAt = (options.focus === 'face' ? FACE_TARGET : DEFAULT_TARGET).slice();
  return timedFrame(options.time ?? 1.0);
}

// ==============================================================================================
// H. Start-up, and recovery if the browser takes the GPU away (after a too-long frame, or when the
//    system needs it): pause, show the poster again, and rebuild when the context comes back.
// ==============================================================================================
if (!gl) {
  showFallback('This demo needs WebGL, which this browser does not offer.');
} else {
  // Start compiling only after the poster has had a chance to appear on screen.
  requestAnimationFrame(() => setTimeout(startCompiling, 0));
  canvas.addEventListener('webglcontextlost', (event) => {
    event.preventDefault();                       // tells the browser we want the context back
    contextLost = true;
    programReady = false;
    document.body.classList.remove('ready');
    updateRunning();
  });
  canvas.addEventListener('webglcontextrestored', () => {
    contextLost = false;
    msPerMegapixel = null;                        // the device may behave differently now: re-measure
    startCompiling();
  });
}
</script>
</body>
